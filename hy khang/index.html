<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>happy travel time</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header class="text-center py-4 bg-primary text-white">
        <h1>Happy travel</h1>
        <p>Your travel will be your cool time ever</p>
    </header>


    <div class="container my-4">
        <h2 class="text-center">Top Destinations</h2>
        <div id="travelCarousel" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="images/paris.jpg" class="d-block w-100" alt="Paris">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Paris</h5>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="images/rome.jpg" class="d-block w-100" alt="Rome">
                    <div class="carousel-caption d-none d-md-block"><h5>Rome</h5></div>
                </div>
                <div class="carousel-item">
                    <img src="images/tokyo.jpg" class="d-block w-100" alt="Tokyo">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Tokyo</h5></div>
                </div>
            </div>
            <a class="carousel-control-prev" href="#travelCarousel" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#travelCarousel" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
            </a>
        </div>
    </div>


    <div class="container my-4">
        <h2 class="text-center">Popular place you can come</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <img src="images/london.jpg" class="card-img-top" alt="London">
                    <div class="card-body"><h5 class="card-title">London</h5></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="images/ny.jpg" class="card-img-top" alt="New York">
                    <div class="card-body">
                        <h5 class="card-title">New York</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="images/sydney.jpg" class="card-img-top" alt="Sydney">
                    <div class="card-body">
                        <h5 class="card-title">Sydney</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <footer class="text-center py-4 bg-dark text-white">
        <p>Contact us</p>
    </footer>


</body>
</html>
